<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Words — Adaora Mbanefo</title>
  <meta name="description" content="Adaora Mbanefo is an undergraduate at UIUC. NLP, machine learning, AI engineering, and deep love of all things language.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=Space+Grotesk:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/style.css">
  <style>
.fig{width:100%;max-width:560px;justify-self:end;cursor:default;margin-right:-30px}
.page-head{padding:150px 0 48px}
.page-head .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:end}
.page-head h1{font-size:clamp(56px,7.4vw,104px);line-height:.92;letter-spacing:-.03em}
.page-head .q{font-family:var(--display);font-weight:300;font-size:clamp(22px,2.2vw,30px);line-height:1.3;color:var(--forest);margin:0}
.page-head .q b{font-weight:500;color:var(--ink)}
.tools{display:flex;gap:10px;align-items:center;margin:0 0 28px;flex-wrap:wrap}
.tools .count{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust);font-weight:600;margin-right:auto}
.tools button{background:none;border:1.5px solid var(--forest);color:var(--forest);border-radius:999px;padding:8px 14px;font:600 13px var(--sans);cursor:pointer;transition:.2s}
.tools button:hover,.tools button.on{background:var(--forest);color:var(--cream)}
.deck{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;perspective:1200px}
.fc{position:relative;height:230px;cursor:pointer;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.fc.flip{transform:rotateY(180deg)}
.fc>div{position:absolute;inset:0;border-radius:20px;padding:28px 26px;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:space-between}
.fc .front{background:var(--cream)}
.fc .back{background:var(--forest);color:var(--cream);transform:rotateY(180deg)}
.fc .k{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--rust);font-weight:600}
.fc .back .k{color:var(--mustard);font-family:var(--display);font-size:18px;text-transform:none;letter-spacing:0;font-weight:400;font-style:italic}
.fc .w{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.05;letter-spacing:-.01em}
.fc .w em{display:block;font-family:var(--sans);font-style:normal;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--forest);font-weight:600;margin-top:10px;opacity:.8}
.fc .d{font-size:16px;line-height:1.5}
.fc .d small{display:block;font-size:13px;opacity:.75;margin-top:10px;font-style:italic}
.fc .hint{font-size:12px;opacity:.6}
.deck.list{display:block;perspective:none}
.deck.list .fc{height:auto;transform:none;cursor:default;display:grid;grid-template-columns:260px 1fr;gap:28px;padding:18px 0;border-top:1px solid rgba(20,55,38,.16)}
.deck.list .fc>div{position:static;background:none;padding:0;transform:none;color:inherit;display:block}
.deck.list .fc .front .k,.deck.list .fc .hint,.deck.list .fc .back .k{display:none}
.deck.list .fc .w{font-size:26px}
.deck.list .fc .back{color:var(--ink)}
.deck.list .fc .d{padding-top:6px}
.qc{background:var(--cream);border-radius:20px;padding:28px 28px 26px;display:flex;flex-direction:column;break-inside:avoid;margin-bottom:22px;transition:.25s}
.qc:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(20,55,38,.14)}
.qc .t{font-family:var(--display);font-weight:300;font-size:22px;line-height:1.3;color:var(--forest)}
.qc .t::before{content:"\201C";color:var(--mustard);font-weight:500;margin-right:2px}
.qc .t::after{content:"\201D";color:var(--mustard);font-weight:500;margin-left:2px}
.qc .by{font-size:13px;font-weight:600;color:var(--rust);margin-top:16px}
.qc .by a{color:inherit}
.deck.quotes{display:block;columns:3;column-gap:22px;perspective:none}
@media(max-width:900px){.deck.quotes{columns:1}}
section.list{display:block;padding:0 0 110px}
@media(max-width:900px){.page-head .grid{grid-template-columns:1fr}.deck{grid-template-columns:1fr}.deck.list .fc{grid-template-columns:1fr;gap:6px}}
  </style>
</head>
<body>
<nav class="nav">
  <span class="brand">adaora</span>
  <a href="/">home</a><a href="/research/">research</a><a href="/projects/">projects</a><a class="on" href="/about/">about</a><a href="/resume/">resume</a>
</nav>

<main>
<section class="page-head" style="display:block">
  <div class="wrap grid">
    <div>
      <p class="label rv">Words and quotes I like</p>
      <h1 class="rv d1">An ever-<br>growing list</h1>
    </div>
    <p class="q rv d2">Collected from books, life, lectures, and my friends.<br><b id="hint">Tap a word to flip it.</b></p>
  </div>
</section>

<section class="list">
  <div class="wrap">
    <div class="tools rv">
      <span class="count" id="count"></span>
      <button class="on" id="b-words" type="button">words</button>
      <button id="b-quotes" type="button">quotes</button>
      <button id="b-shuffle" type="button">shuffle ↻</button>
    </div>
    <div class="deck rv d1" id="deck"></div>
  </div>
</section>
</main>

<footer>
  <div class="wrap">
    <div><a href="mailto:adaorambanefo@gmail.com">Email</a><a href="https://github.com/adodobird8" target="_blank" rel="noopener">GitHub</a><a href="https://www.linkedin.com/in/adaora-mbanefo" target="_blank" rel="noopener">LinkedIn</a></div>
    <div class="sig">&copy; adaora</div>
  </div>
</footer>
<script src="/words.js"></script>
<script>
(function(){
  const deck=document.getElementById('deck'), count=document.getElementById('count');
  const bw=document.getElementById('b-words'), bq=document.getElementById('b-quotes'), bs=document.getElementById('b-shuffle');
  let mode='words', W=(window.WORDS||[]).slice(), Q=(window.QUOTES||[]).slice();
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
  function render(){
    deck.innerHTML=''; deck.classList.toggle('quotes',mode==='quotes');
    if(mode==='words'){
      count.textContent=W.length+' words and counting';
      W.forEach(w=>{
        const c=document.createElement('div'); c.className='fc'; c.setAttribute('role','button'); c.tabIndex=0;
        c.innerHTML=`<div class="front"><span class="k">word</span><span class="w">${esc(w[0])}<em>${esc(w[1]||'')}</em></span><span class="hint">tap to flip</span></div>
                     <div class="back"><span class="k">${esc(w[0])}</span><span class="d">${esc(w[2])}${w[3]?`<small>${esc(w[3])}</small>`:''}</span><span class="hint">tap to flip back</span></div>`;
        const t=()=>c.classList.toggle('flip');
        c.addEventListener('click',t); c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();t()}});
        deck.appendChild(c);
      });
    }else{
      count.textContent='';
      Q.forEach(q=>{
        const c=document.createElement('div'); c.className='qc';
        const by=q[2]?`<a href="${esc(q[2])}" target="_blank" rel="noopener">${esc(q[1])}</a>`:esc(q[1]);
        c.innerHTML=`<span class="t">${esc(q[0])}</span><span class="by">— ${by}</span>`;
        deck.appendChild(c);
      });
    }
  }
  function sh(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
  const hint=document.getElementById('hint');
  bw.onclick=()=>{mode='words';hint.textContent='Tap a word to flip it.';bw.classList.add('on');bq.classList.remove('on');render()};
  bq.onclick=()=>{mode='quotes';hint.textContent='';bq.classList.add('on');bw.classList.remove('on');render()};
  bs.onclick=()=>{sh(mode==='words'?W:Q);render()};
  render();
})();
</script>
<script src="/script.js"></script>
</body>
</html>
